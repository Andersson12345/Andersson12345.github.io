<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Webbplats där användaren kan välja en bil och uppgradera den med motor, fälgar och turbo.">

    <title>Bygg din bil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Välj din bil</h1>
</header>

<main>

<div class="container">

    <div class="bil">
        <img src="img/mercedes_gt63.jpg" alt="Mercedes GT63 som användaren kan välja">
        <button id="mercedes">Mercedes GT63</button>
    </div>

    <div class="bil">
        <img src="img/Bmw_m4.jpg" alt="BMW M4 som användaren kan välja">
        <button id="bmw">BMW M4</button>
    </div>

    <div class="bil">
        <img src="img/audi_rs6.jpg" alt="Audi RS6 som användaren kan välja">
        <button id="audi">Audi RS6</button>
    </div>

</div>

</main>

<script src="script.js"></script>

</body>
</html>
